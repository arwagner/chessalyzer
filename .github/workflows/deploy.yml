name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# One deploy at a time, and never cancel one half-way through.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://chessalyzer.vawagners.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Install the deploy key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
      # The key can only run millwright's scripts/chessalyzer-deploy.sh, which unpacks this commit, rebuilds
      # the chessalyzer containers, checks their health, and rolls back to the previous release if that fails.
      - name: Deploy
        run: git archive --format=tar "$GITHUB_SHA" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes root@187.124.159.132 deploy "$GITHUB_SHA"
      - name: Check the live site
        run: |
          start='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1'
          body="{\"fen\":\"$start\",\"algorithm\":\"random\",\"budgetMs\":1}"
          for i in $(seq 1 10); do
            curl -sf https://chessalyzer.vawagners.cloud/ > /dev/null \
              && curl -sf -X QUERY -H 'content-type: application/json' -d "$body" https://chessalyzer.vawagners.cloud/api/search \
              && exit 0
            sleep 3
          done
          echo "chessalyzer.vawagners.cloud is not answering / and /api/search" >&2
          exit 1
